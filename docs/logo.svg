  <g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round">
    <path d="M25.83 22.67 A11 11 0 0 1 25.83 41.33"/>
    <path d="M29.54 16.74 A18 18 0 0 1 29.54 47.26"/>
    <path d="M33.25 10.80 A25 25 0 0 1 33.25 53.20"/>
  </g>
</svg>
